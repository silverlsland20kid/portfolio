<!doctype html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aupale Vodka Clone</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
</head>

<body>
  <div class="wrap">
    <header class="header">
      <div class="header__inner">
        <a href="#" class="header__logo">AUPALE</a>

        <nav class="header__nav">
          <a href="#">Story</a>
          <a href="#">Products</a>
          <a href="#">Contact</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="hero section">
        <div class="hero__bg">
          <video class="hero__video" autoplay muted loop playsinline>
            <source src="/video/hero.mp4" type="video/mp4" />
          </video>
        </div>

        <div class="hero__content">
          <h1 class="hero__title">
            <span>Born from</span>
            <span><em>The Untouched</em></span>
            <span>Wilderness.</span>
          </h1>

          <div class="hero__thumb">
            <img src="/src/assets/images/thumb-01.jpg" alt="" />
          </div>

          <p class="hero__desc">
            A clean and minimal brand experience inspired by nature,
            silence and refined craftsmanship.
          </p>
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>

</html>
